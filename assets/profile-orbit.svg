<svg width="300" height="150" viewBox="0 0 300 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#02040a"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" rx="16" ry="16" />

  <!-- Soft glow -->
  <circle cx="150" cy="75" r="70" fill="url(#glow)" />

  <g transform="translate(150,75)">
    <!-- Core circle -->
    <circle r="40" fill="#0d1117" stroke="#30363d" stroke-width="2" />

    <!-- Inner pulse ring -->
    <circle r="32" fill="none" stroke="#238636" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="18s"
        repeatCount="indefinite"
      />
    </circle>

    <!-- Outer orbit path -->
    <circle r="58" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="5 7" opacity="0.7">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="360"
        to="0"
        dur="24s"
        repeatCount="indefinite"
      />
    </circle>

    <!-- Orbiting nodes -->
    <g>
      <!-- AI node -->
      <g>
        <circle cx="58" cy="0" r="4.5" fill="#58a6ff" />
        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0 0 0"
          to="360 0 0"
          dur="14s"
          repeatCount="indefinite"
        />
      </g>

      <!-- Infra node -->
      <g>
        <circle cx="-58" cy="0" r="4" fill="#f0883e" />
        <animateTransform
          attributeName="transform"
          type="rotate"
          from="180 0 0"
          to="540 0 0"
          dur="20s"
          repeatCount="indefinite"
        />
      </g>

      <!-- Games node -->
      <g>
        <circle cx="0" cy="58" r="4" fill="#3fb950" />
        <animateTransform
          attributeName="transform"
          type="rotate"
          from="90 0 0"
          to="450 0 0"
          dur="11s"
          repeatCount="indefinite"
        />
      </g>
    </g>

    <!-- Center label -->
    <text
      x="0"
      y="0"
      text-anchor="middle"
      dominant-baseline="middle"
      fill="#e6edf3"
      font-size="12"
      font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">
      Research Software Engineer
    </text>
  </g>
</svg>
